[package]
name = "rpi-ponytail"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ponytail coding instructions for rpi"
repository = "https://github.com/morler/rpi-ponytail"
homepage = "https://github.com/morler/rpi-ponytail"
readme = "README.md"
keywords = ["rpi", "plugin", "ponytail", "prompt"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = "=0.8.5"
serde_json = "1"
